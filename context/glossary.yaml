# The terms the policy wording defines, each in the wording's own words, with the
# section it comes from.

source:
  system: The policy wording, version 2026.1
  owner: Legal
  reviewed: "2026-09-01"

terms:
  - term: Carrier
    definition: An airline, railway, ferry, cruise or coach company that you have a ticket with.
    sections: [12]

  - term: Covered trip
    definition: The trip on your policy record, from the departure date to the return date.
    sections: [12]

  - term: Family member
    definition: Your spouse or partner, child, parent, sibling, grandparent or grandchild.
    sections: [12]

  - term: Physician
    definition: A licensed medical doctor who is not you, a traveling companion or a family member.
    sections: [12]

  - term: Traveling companion
    definition: A person named as a traveler on your policy record.
    sections: [12]

  - term: Deductible
    definition: >-
      The amount your plan takes off a payment: $100 on Economy, $50 on Premium and
      $0 on First. The deductible applies once per claim to Baggage and Personal
      Effects and to Emergency Medical. It does not apply to the other benefits.
    sections: [1]

  - term: Waiting period
    definition: >-
      How long a delay must last before Trip Delay or Baggage Delay pays, which
      depends on the plan. A Trip Delay runs from the scheduled departure time to the
      time you actually depart. A Baggage Delay runs from your arrival at your
      destination to the delivery of your checked baggage.
    sections: [1, 3, 4]

  - term: Per-item limit
    definition: >-
      The most we pay for any one item of baggage or personal effects. A pair or a
      set, such as a pair of shoes, a suit or a camera with its lens, counts as one
      item.
    sections: [5]

  - term: Unattended
    definition: >-
      Out of your sight and out of your reach in a place the public can get to.
      Belongings in a vehicle are unattended unless they are locked in the trunk or
      the glove compartment and out of sight.
    sections: [5]

  - term: Pre-existing condition
    definition: >-
      A condition you had symptoms of, saw a physician about, received treatment for
      or had a change in medication for in the 60 days before you bought the policy.
    sections: [7]

  - term: Adventure sports
    definition: >-
      Bungee jumping, skydiving, paragliding, scuba diving deeper than 10 meters (33
      feet), heli-skiing, roped mountaineering and white-water rafting above grade 3.
    sections: [8]

  - term: Electronics
    definition: Phones, tablets, laptops, cameras and their lenses, e-readers and smartwatches.
    sections: [8]

  - term: Consequential losses
    definition: >-
      Losses that follow indirectly from an incident, such as lost earnings, missed
      events or contractual penalties.
    sections: [9]

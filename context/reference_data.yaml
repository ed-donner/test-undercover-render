# Facts from outside UnderCover that claims often turn on: events that disrupt
# travel, the places where adventure sports happen, and products with their list
# prices.

source:
  system: Outside data providers
  owner: Claims operations
  reviewed: "2026-09-30"

topics:
  - topic: events
    description: Storms, strikes and other events that disrupt travel, from weather services, carriers and news wires
    facts:
      - >-
        National Hurricane Center, July 9, 2026: Tropical Storm Marisol has formed
        east of the Leeward Islands. It is forecast to become a hurricane on July 11
        and to pass over the Bahamas on July 12 and 13.
      - >-
        National Hurricane Center, August 18, 2026: Tropical Storm Tobias has formed
        in the western Caribbean. It is expected to become a hurricane and to reach
        the coast of the Yucatan Peninsula near Cancun on August 21.
      - >-
        Lisbon, June 20, 2026: Portugal's air traffic controllers have announced a 48
        hour strike starting at midnight on July 14. Most flights to and from Lisbon
        and Porto are expected to be canceled on July 14 and 15.
      - >-
        Meridian Air press release, August 5, 2026: The union representing our cabin
        crew has called a strike for August 12 and 13. We expect to cancel about half
        of our flights on those two days and will rebook affected passengers.
      - >-
        North Atlantic weather bulletin, September 2, 2026: Storm Ysolde has been
        named. Gales are expected across Ireland, Wales and western Scotland from the
        morning of September 4, and ferry crossings on the Irish Sea are likely to be
        canceled.
      - >-
        Rome, July 3, 2026: Italy's rail unions have called a 24 hour national rail
        strike from 9 pm on July 21 to 9 pm on July 22. Most high-speed and regional
        trains will not run.
      - >-
        National Hurricane Center, June 30, 2026: Tropical Storm Nadia has formed in
        the southern Gulf of Mexico and is expected to come ashore in Tamaulipas,
        Mexico, on July 2.
      - >-
        Northwind Airlines press release, July 15, 2026: The pilots' strike planned
        for July 24 has been called off after an agreement with the union. All flights
        will operate as scheduled.
      - >-
        Japan Meteorological Agency, August 24, 2026: Typhoon Kaori is expected to
        pass close to Okinawa on August 27 and 28. Flights and ferries in the Ryukyu
        Islands are likely to be suspended.
      - >-
        Athens, August 19, 2026: Greek ferry workers have called a 24 hour strike for
        August 27. Ferries between Piraeus and the islands will stay in port.
      - >-
        Paris, May 29, 2026: French air traffic controllers have called a strike for
        June 10 and 11, and flights across France are expected to be canceled.

  - topic: places
    description: Dive sites, rivers and activity operators, from tour operators' listings
    facts:
      - >-
        Sentinel Wall, Cayo Brava, Honduras: a wall dive. The top of the wall is at 14
        meters and it drops past 40 meters, so every dive on it goes deeper than 10
        meters.
      - >-
        Parrotfish Garden, Cayo Brava, Honduras: a shallow reef dive for beginners.
        The reef lies between 4 and 8 meters, and no part of the site is deeper than 9
        meters.
      - >-
        Tallow Gorge, Rio Cuyo, Costa Rica: a white-water rafting run with grade 4
        rapids from start to finish.
      - >-
        Lantern Run, Rio Cuyo, Costa Rica: a family rafting trip on the lower river,
        with grade 2 rapids from start to finish.
      - >-
        Aerie Adventures, Interlaken, Switzerland: tandem paragliding flights from
        Beatenberg, landing in Interlaken.
      - >-
        Talon Excursions, Queenstown, New Zealand: jet-boat rides through the canyons
        of the Arrowmere River.
      - >-
        Blue Chimney, Cayo Brava, Honduras: a cavern dive that runs from 6 meters down
        to 16 meters.
      - >-
        Upper Rio Cuyo, Costa Rica: grade 5 rapids, run only by expert kayakers.
      - >-
        Glacier Air, Interlaken, Switzerland: helicopter sightseeing flights over the
        Jungfrau region.
      - >-
        Highline Canyoning, Interlaken, Switzerland: guided canyoning trips with
        abseils and jumps into pools.

  - topic: products
    description: Devices and their list prices, from a product catalog
    facts:
      - >-
        Corvane Lumen X2: a smartwatch with GPS, heart-rate tracking and contactless
        payments. Released in March 2026 at a list price of $649.
      - >-
        Halden Arc: a pocket projector that throws a picture of up to 100 inches from
        a phone or laptop. List price $899.
      - >-
        Vantor Halo: a titanium smart ring that tracks sleep, heart rate and activity.
        List price $449.
      - >-
        Lumora Drift 3: an e-reader with a 7 inch color E Ink screen and a battery
        that lasts six weeks. List price $329.
      - >-
        Brisa Pocket 2: a compact digital camera with a 1 inch sensor and a fixed
        24-120mm zoom lens. List price $1,099.
      - >-
        Quillon Wayfinder 5: a handheld GPS unit for hikers, with topographic maps and
        two-way satellite messaging. List price $599.
      - >-
        Sorrel Tab S: an 11 inch Android tablet that comes with a keyboard cover. List
        price $749.
      - >-
        Corvane Lumen X1: the earlier Corvane smartwatch, released in 2024 at a list
        price of $449.
      - >-
        Ostra Buds 3: wireless noise-canceling earbuds with a charging case. List
        price $249.
      - >-
        Fennec Volt 20: a 20,000 mAh power bank that can charge a laptop. List price
        $129.
      - >-
        Halden Beam: a portable Bluetooth speaker with a built-in lamp. List price
        $199.
      - >-
        Lumora Drift 2: the earlier Lumora e-reader, with a 6 inch black and white
        screen. List price $199.
